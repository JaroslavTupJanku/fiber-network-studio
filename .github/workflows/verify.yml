name: Verify

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Lint frontend
        run: pnpm lint
        working-directory: frontend
      - name: Build frontend
        run: pnpm build
        working-directory: frontend
      - name: Build API
        run: dotnet build backend/FiberNetworkStudio.Api/FiberNetworkStudio.Api.csproj
      - name: Run tests
        run: node --test tests/*.test.mjs
      - name: Build single-address customer preview
        run: docker build -t fiber-network-studio-preview:ci .
      - name: Smoke test customer preview
        run: |
          docker run --rm -d --name fiber-network-studio-preview-ci -p 127.0.0.1:18080:8080 fiber-network-studio-preview:ci
          trap 'docker stop fiber-network-studio-preview-ci' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:18080/api/health > /dev/null; then break; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/customers/example)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/not-a-route)" = 404
      - name: Smoke test fictional demo initialization
        run: |
          docker run --rm -d --name fiber-network-studio-demo-ci -p 127.0.0.1:18081:8080 -e FNS_DEMO_SEED=1 -v /app/App_Data fiber-network-studio-preview:ci
          trap 'docker stop fiber-network-studio-demo-ci' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:18081/api/health > /dev/null; then break; fi
            sleep 1
          done
          FNS_DEMO_URL=http://127.0.0.1:18081 node scripts/check-demo.mjs
